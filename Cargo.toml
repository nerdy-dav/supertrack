[package]
name = "supertrack"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "supertrack"
path = "src/main.rs"

[dependencies]
axum = "0.7.4"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
minijinja = { version = "2.20.0", features = ["loader", "json"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
