{% extends "base.html" %}
{% block content %}
<div class="page-header"><h1>{% if employee %}Edit{% else %}Add{% endif %} Employee</h1></div>
<div class="form-card">
  <form method="post">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" value="{{ employee.name | default(value='') }}" required>
    </div>
    <div class="form-group">
      <label>Employment Type</label>
      <select name="employment_type">
        <option value="full-time" {% if employee.employment_type == "full-time" %}selected{% endif %}>Full-time</option>
        <option value="part-time" {% if employee.employment_type == "part-time" %}selected{% endif %}>Part-time</option>
        <option value="casual" {% if employee.employment_type == "casual" %}selected{% endif %}>Casual</option>
      </select>
    </div>
    <div class="form-group">
      <label>Super Fund Name</label>
      <input type="text" name="super_fund_name" value="{{ employee.super_fund_name | default(value='') }}" required placeholder="e.g. Australian Super">
    </div>
    <div class="form-group">
      <label>Super Fund USI (optional)</label>
      <input type="text" name="super_fund_usi" value="{{ employee.super_fund_usi | default(value='') }}" placeholder="e.g. STA0100AU">
    </div>
    <div class="form-group">
      <label>Member Number (optional)</label>
      <input type="text" name="member_number" value="{{ employee.member_number | default(value='') }}">
    </div>
    <div class="form-group">
      <label>Ordinary Time Earnings (OTE) per week ($)</label>
      <input type="number" name="ote_weekly" value="{{ employee.ote_weekly | default(value=0) }}" step="0.01" min="0" required>
      <small class="help">Super is calculated on OTE. Don't include overtime.</small>
    </div>
    <div class="form-group">
      <label>Start Date</label>
      <input type="date" name="start_date" value="{{ employee.start_date | default(value='') }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Employee</button>
    <a href="/employees" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
