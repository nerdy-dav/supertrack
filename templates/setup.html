{% extends "base.html" %}
{% block content %}
<div class="page-header"><h1>Business Setup</h1></div>
<div class="form-card">
  <form method="post" action="/setup">
    <div class="form-group">
      <label>Business Name</label>
      <input type="text" name="name" value="{{ business.name | default('') }}" required>
    </div>
    <div class="form-group">
      <label>ABN (11 digits, no spaces)</label>
      <input type="text" name="abn" value="{{ business.abn | default('') }}" pattern="\d{11}" placeholder="12345678901">
    </div>
    <div class="form-group">
      <label>State / Territory</label>
      <select name="state">
        {% for s in states %}
        <option value="{{ s }}" {% if business.state == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Pay Frequency</label>
      <select name="pay_frequency">
        {% for f in frequencies %}
        <option value="{{ f }}" {% if business.pay_frequency == f %}selected{% endif %}>{{ f | capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Payroll Software</label>
      <select name="payroll_software">
        <option value="xero" {% if business.payroll_software == "xero" %}selected{% endif %}>Xero</option>
        <option value="myob" {% if business.payroll_software == "myob" %}selected{% endif %}>MYOB</option>
        <option value="employment_hero" {% if business.payroll_software == "employment_hero" %}selected{% endif %}>Employment Hero</option>
        <option value="manual" {% if business.payroll_software == "manual" %}selected{% endif %}>Manual / Spreadsheet</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Current Clearing House</label>
      <input type="text" name="clearing_house" value="{{ business.clearing_house | default('') }}" placeholder="e.g. AMP, Mercer, Australian Super">
      <small class="help">⚠️ If you use SBSCH, you must switch by 30 June 2026</small>
    </div>
    <div class="form-group">
      <label>Clearing House Processing Lag (business days)</label>
      <input type="number" name="clearing_house_lag_days" value="{{ business.clearing_house_lag_days | default(1) }}" min="0" max="3">
      <small class="help">How many business days does it take for your clearing house to forward funds to funds?</small>
    </div>
    <div class="form-group">
      <label>SGC Rate (%)</label>
      <input type="number" name="sgc_rate" value="{{ business.sgc_rate | default(0.12) }}" step="0.01" min="0.01" max="0.20">
      <small class="help">12% from 1 July 2025</small>
    </div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
{% endblock %}
