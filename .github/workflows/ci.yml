name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test
      - run: cargo check

  build:
    if: github.event_name == 'release'
    name: Build (${{ matrix.target }})
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/supertrack${{ matrix.ext }}" \
             "supertrack-${{ matrix.target }}${{ matrix.ext }}"
          zip "supertrack-${{ matrix.target }}.zip" \
             "supertrack-${{ matrix.target }}${{ matrix.ext }}"
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/supertrack${{ matrix.ext }}" `
            -Destination "supertrack-${{ matrix.target }}${{ matrix.ext }}"
          Compress-Archive -Path "supertrack-${{ matrix.target }}${{ matrix.ext }}" `
            -DestinationPath "supertrack-${{ matrix.target }}.zip"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: supertrack-${{ matrix.target }}.zip
