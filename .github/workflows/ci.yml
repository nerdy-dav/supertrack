name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test
      - run: cargo check

  build:
    if: github.event_name == 'release'
    name: Build (${{ matrix.target }})
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="supertrack-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/supertrack${{ matrix.ext }}" "$dir/"
          cp -r templates "$dir/"
          zip -r "${dir}.zip" "$dir"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "supertrack-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir
          Copy-Item "target/${{ matrix.target }}/release/supertrack${{ matrix.ext }}" `
            -Destination "$dir/supertrack${{ matrix.ext }}"
          Copy-Item -Recurse -Path templates -Destination "$dir/"
          Compress-Archive -Path $dir -DestinationPath "${dir}.zip"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: supertrack-${{ matrix.target }}.zip
